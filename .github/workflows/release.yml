name: Release

# Релиз публикуется после зелёного CI на main: если версии из корневого package.json ещё нет среди тегов, создаются тег
# vX.Y.Z и релиз GitHub с текстом из раздела CHANGELOG.md. Версия и правила номеров — docs/releases.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/release.sh
