name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # CSP панели (font-src 'self') блокирует встроенные data:-шрифты и внешние ресурсы
      - run: |
          ! grep -lE 'data:font|fonts.googleapis|url\(https?:' dist/assets/*.css

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n server/src/scripts/deploy-awg.sh && bash -n server/src/scripts/deploy-bridge.sh && bash -n server/src/scripts/update-panel.sh && bash -n server/test/docker/nodes.sh && bash -n server/test/docker/entrypoint.sh && bash -n server/test/install/run.sh && bash -n server/test/install/in-container.sh && bash -n server/test/install/common.sh && bash -n server/test/install/migration-old.sh && bash -n server/test/install/migration-new.sh && bash -n server/test/install/upgrade.sh && bash -n .github/scripts/release.sh
      - run: shellcheck -S error install.sh server/src/scripts/deploy-awg.sh server/src/scripts/deploy-bridge.sh server/src/scripts/update-panel.sh server/test/docker/nodes.sh server/test/docker/entrypoint.sh server/test/install/run.sh server/test/install/in-container.sh server/test/install/common.sh server/test/install/migration-old.sh server/test/install/migration-new.sh server/test/install/upgrade.sh .github/scripts/release.sh

  # install.sh целиком в чистом Ubuntu: настоящие apt, Node.js, сборка и запуск; проверяет случайные логин/пароль и вывод данных
  # подключения, перенос панели между двумя контейнерами и обновление работающей панели с предыдущего релиза (нужны теги: fetch-depth 0).
  # Не блокирует остальные проверки, пока не накоплена статистика стабильности (нужен интернет).
  install:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash server/test/install/run.sh

  # Реальные ноды (Docker-in-Docker с SSH): весь набор тестов, включая real-*.test.ts. Не блокирует остальные проверки,
  # пока не накоплена статистика стабильности (тесты скачивают образ AmneziaWG из интернета).
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: bash test/docker/nodes.sh up
      - run: npm test
      - if: always()
        run: bash test/docker/nodes.sh down
